<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c5d4"/>
      <stop offset="1" stop-color="#f9dac6"/>
    </linearGradient>
    <radialGradient id="petal" cx="50%" cy="100%" r="100%">
      <stop offset="0" stop-color="#df6a86"/>
      <stop offset="0.55" stop-color="#f3a3b6"/>
      <stop offset="1" stop-color="#fde3e9"/>
    </radialGradient>
    <radialGradient id="inner" cx="50%" cy="100%" r="100%">
      <stop offset="0" stop-color="#c94a68"/>
      <stop offset="1" stop-color="#f6b9c7"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fbe2a0"/>
      <stop offset="1" stop-color="#e2a94e"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 262)">
    <g id="outer">
      <ellipse cx="0" cy="-92" rx="66" ry="108" fill="url(#petal)"/>
    </g>
    <use href="#outer" transform="rotate(60)"/>
    <use href="#outer" transform="rotate(120)"/>
    <use href="#outer" transform="rotate(180)"/>
    <use href="#outer" transform="rotate(240)"/>
    <use href="#outer" transform="rotate(300)"/>
    <g id="mid" transform="rotate(30)">
      <ellipse cx="0" cy="-58" rx="38" ry="66" fill="url(#inner)" opacity="0.9"/>
    </g>
    <use href="#mid" transform="rotate(60)"/>
    <use href="#mid" transform="rotate(120)"/>
    <use href="#mid" transform="rotate(180)"/>
    <use href="#mid" transform="rotate(240)"/>
    <use href="#mid" transform="rotate(300)"/>
    <circle r="40" fill="url(#core)"/>
    <circle r="40" fill="none" stroke="#c98a38" stroke-width="4" opacity="0.35"/>
  </g>
</svg>
