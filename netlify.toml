# Sitio estático: se publica la raíz del repositorio.
# El único "build" convierte la imagen de vista previa (og:image) en URL absoluta
# usando el dominio del sitio ($URL lo define Netlify), que es lo que exige WhatsApp.
[build]
  publish = "."
  command = '''sed -i "s|\"og-image.jpg\"|\"$URL/og-image.jpg\"|" index.html'''

# Imágenes, íconos y música cambian poco: caché de una semana
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
